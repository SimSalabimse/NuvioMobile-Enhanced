name: Repo text

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-text-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-text:
    name: Names, keys, addon URLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check repo text
        env:
          CHECK_REPO_TEXT_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check-repo-text.py
