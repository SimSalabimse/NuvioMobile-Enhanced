name: beta-gates

# Required checks for a pull request into beta. GitHub shows each name as
# "beta-gates / <job>". A ruleset can require these names.
on:
  pull_request:
    branches:
      - beta
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-ios:
    name: compile-ios
    uses: ./.github/workflows/ios-simulator-compile.yml
    with:
      from_beta_gates: true

  compile-android:
    name: compile-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Android and shared code
        run: |
          set -euo pipefail
          touch local.properties
          for attempt in 1 2 3; do
            if ./gradlew :composeApp:compileAndroidMain --stacktrace; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

  build:
    name: build
    needs: [compile-ios, compile-android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the iOS and Android compiles
        run: |
          set -euo pipefail
          test "${{ needs.compile-ios.result }}" = success
          test "${{ needs.compile-android.result }}" = success

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NUVIO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NUVIO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NUVIO_BASE_REF: ${{ github.base_ref || 'beta' }}
      NUVIO_PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sync-worker/package-lock.json

      - name: Prefetch Robolectric
        run: |
          set -euo pipefail
          # Robolectric 4.16 skips its own download when these jars are already in
          # ~/.m2. Host tests use SDK 26, 28, 34, and 36. Maven Central 429s this
          # runner and sends a long Retry-After. curl --retry waits that out, and
          # --retry-max-time makes the runner curl give up immediately while still
          # exiting 0, so the jar never lands and every SDK test fails.
          versions=(
            "8.0.0_r4-robolectric-r1-i7"
            "9-robolectric-4913185-2-i7"
            "14-robolectric-10818077-i7"
            "16-robolectric-13921718-i7"
          )
          mirrors=(
            "https://maven-central.storage-download.googleapis.com/maven2"
            "https://repo1.maven.org/maven2"
          )
          fetch_jar() {
            local version="$1"
            local name="android-all-instrumented-${version}.jar"
            local dest="${HOME}/.m2/repository/org/robolectric/android-all-instrumented/${version}/${name}"
            local attempt mirror url magic
            mkdir -p "$(dirname "$dest")"
            for attempt in 1 2 3 4 5; do
              for mirror in "${mirrors[@]}"; do
                url="${mirror}/org/robolectric/android-all-instrumented/${version}/${name}"
                rm -f "$dest"
                # --retry 0 ignores Retry-After. A 429 must not stall or look successful.
                if curl -fL --retry 0 --connect-timeout 20 --max-time 180 -o "$dest" "$url" \
                  && [[ "$(stat -c%s "$dest")" -gt 10000000 ]]; then
                  magic="$(od -An -t x1 -N 2 "$dest" | tr -d ' \n')"
                  if [[ "$magic" == "504b" ]]; then
                    echo "Prefetched ${name} ($(stat -c%s "$dest") bytes) from ${mirror}"
                    return 0
                  fi
                fi
                rm -f "$dest"
              done
              sleep $((attempt * 2))
            done
            echo "Failed to prefetch ${name}" >&2
            return 1
          }
          for version in "${versions[@]}"; do
            fetch_jar "$version"
          done

      - name: Run host tests
        run: |
          set -euo pipefail
          touch local.properties
          # Robolectric's Android image download sometimes resets mid-suite.
          for attempt in 1 2; do
            if ./gradlew :composeApp:testAndroidHostTest --continue --stacktrace; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Run sync-worker tests
        working-directory: sync-worker
        run: npm ci && npm test

      - name: Run the upstream guard
        run: bash scripts/check-beta-upstream-guard.sh

  ui-sim:
    name: ui-sim
    # The free macOS image has Xcode 26, which cannot compile this app, and
    # its rebuild was cancelled at 55 minutes. This job uses the Xcode 27
    # runner, with 110 minutes and the Gradle and Kotlin/Native caches.
    runs-on: xcode-27
    timeout-minutes: 110
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      NUVIO_IOS_DISTRIBUTION: appstore
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: false

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" && -d "$ANDROID_HOME/platforms" ]]; then
            exit 0
          fi
          sdk="${HOME}/android-sdk"
          mkdir -p "${sdk}/cmdline-tools"
          curl -fsSL -o /tmp/android-cmdtools.zip https://dl.google.com/android/repository/commandlinetools-mac-13114758_latest.zip
          rm -rf /tmp/android-cmdtools
          unzip -q /tmp/android-cmdtools.zip -d /tmp/android-cmdtools
          rm -rf "${sdk}/cmdline-tools/latest"
          mv /tmp/android-cmdtools/cmdline-tools "${sdk}/cmdline-tools/latest"
          yes | "${sdk}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "platforms;android-37.1" || true
          test -d "${sdk}/platforms"
          echo "ANDROID_HOME=${sdk}" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_27.1.app ]]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          else
            latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
            sudo xcode-select -s "${latest}/Contents/Developer"
          fi
          xcodebuild -version

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Warm the Gradle wrapper
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Run the Home and Settings smoke test
        run: |
          set -euo pipefail
          udid="$(python3 - <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          chosen = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("name", "").startswith("iPhone") and device.get("isAvailable", True):
                      chosen.append(device["udid"])
          if not chosen:
              sys.exit("no iPhone simulator")
          print(chosen[-1])
          PY
          )"
          xcrun simctl boot "$udid" || true
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme BetaSmokeUITests \
            -destination "id=${udid}" \
            -derivedDataPath build/ios-ui-sim \
            -only-testing:BetaSmokeUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test

  name-scan:
    name: name-scan
    runs-on: ubuntu-latest
    env:
      NUVIO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NUVIO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NUVIO_BASE_REF: ${{ github.base_ref || 'beta' }}
      NUVIO_HEAD_REF: ${{ github.head_ref || github.ref_name }}
      NUVIO_PR_TITLE: ${{ github.event.pull_request.title }}
      NUVIO_PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan the diff, commits, title, body, and branch
        run: python3 scripts/check-repo-text.py

      - name: Run the dummy-token negative test
        run: python3 scripts/check-repo-text-test.py

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    env:
      NUVIO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      NUVIO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NUVIO_BASE_REF: ${{ github.base_ref || 'beta' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan the commit range
        run: bash scripts/check-secrets.sh

      - name: Run the seeded-example negative test
        run: bash scripts/check-secrets-test.sh

  beta-gate:
    name: beta-gate
    needs: [build, tests, ui-sim, name-scan, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        run: |
          set -euo pipefail
          test "${{ needs.build.result }}" = success
          test "${{ needs.tests.result }}" = success
          test "${{ needs.ui-sim.result }}" = success
          test "${{ needs.name-scan.result }}" = success
          test "${{ needs.secret-scan.result }}" = success
