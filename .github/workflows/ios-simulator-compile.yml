name: iOS simulator compile

# Compiles the iOS simulator Kotlin target, including cinterop. No signing and
# no repository secrets. beta pull requests and pushes are compiled by
# beta-gates.yml, which calls this workflow, so the job below skips those
# events and does not compile twice.
on:
  pull_request:
    branches:
      - beta
      - enhanced
      - cursor/batch12-build207-e33c
      - sync/upstream-0.6.10
      - cursor/multi-segment-same-type-50bf
      - cursor/season-poster-double-tap-03bb
      - cursor/build-214-standing-rules-e595
      - cursor/build-215-season-overview-9455
      - cursor/build-217-full-stack
  push:
    branches:
      - beta
      - enhanced
  workflow_dispatch:
  workflow_call:
    inputs:
      from_beta_gates:
        description: Set by beta-gates so this compile still runs for a beta pull request.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ios-sim-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile iOS simulator
    if: ${{ inputs.from_beta_gates || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'beta') || (github.event_name == 'push' && github.ref != 'refs/heads/beta') }}
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      NUVIO_IOS_DISTRIBUTION: appstore

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Compile simulator Kotlin and cinterop
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived-sim-ci \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            build

      - name: Collect dSYMs
        run: |
          rm -rf build/ios-dsyms
          REQUIRE_APP_DSYM=1 REQUIRE_KOTLIN_DSYM=1 \
            ./scripts/collect-ios-dsyms.sh \
            build/ios-dsyms \
            build/ios-derived-sim-ci/Build/Products \
            composeApp/build/bin

      - name: Upload dSYMs
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-dsyms-${{ github.sha }}
          path: build/ios-dsyms
          if-no-files-found: error
          retention-days: 14
