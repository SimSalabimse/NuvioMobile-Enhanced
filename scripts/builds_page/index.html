<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#221b4a">
<title>Nuvio</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main>
  <header class="mast">
    <h1>Nuvio</h1>
    <p class="lede">Download the current app, or choose how far the next one goes.</p>
  </header>
  <div class="products">
    <section class="product" id="ipa-section" aria-labelledby="ipa-heading">
      <h2 id="ipa-heading">iPhone</h2>
      <div class="package" id="ipa-package"></div>
      <div class="update" id="ipa-update"></div>
      <div class="summary" id="ipa-summary"></div>
      <details class="choose" id="ipa-choose" hidden>
        <summary>Choose commits</summary>
        <div class="cut" id="ipa-cut"></div>
      </details>
      <div class="compile" id="ipa-compile" hidden></div>
    </section>
    <section class="product" id="dmg-section" aria-labelledby="dmg-heading">
      <h2 id="dmg-heading">Mac</h2>
      <div class="package" id="dmg-package"></div>
      <div class="update" id="dmg-update"></div>
      <div class="summary" id="dmg-summary"></div>
      <details class="choose" id="dmg-choose" hidden>
        <summary>Choose commits</summary>
        <div class="cut" id="dmg-cut"></div>
      </details>
      <div class="compile" id="dmg-compile" hidden></div>
    </section>
  </div>
  <details class="older" id="older-downloads" hidden>
    <summary>Older downloads</summary>
    <div id="older"></div>
  </details>
</main>
<script src="/assets/app.js" defer></script>
</body>
</html>
